<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a2012"/>
      <stop offset="100%" stop-color="#0c1009"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="22" y1="22" x2="106" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e3ff9a"/>
      <stop offset="100%" stop-color="#b7ff3c"/>
    </linearGradient>
    <linearGradient id="dot-grad" x1="54" y1="54" x2="74" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e3ff9a"/>
      <stop offset="100%" stop-color="#b7ff3c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="clip">
      <rect x="6" y="6" width="116" height="116" rx="30"/>
    </clipPath>
  </defs>

  <!-- Background rounded rect -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Subtle inner border -->
  <rect x="6.5" y="6.5" width="115" height="115" rx="29.5" stroke="rgba(183,255,60,0.18)" stroke-width="1"/>

  <!-- Crosshair arms — thin, sharp -->
  <line x1="64" y1="28" x2="64" y2="46" stroke="url(#ring-grad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="64" y1="82" x2="64" y2="100" stroke="url(#ring-grad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="28" y1="64" x2="46" y2="64" stroke="url(#ring-grad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="82" y1="64" x2="100" y2="64" stroke="url(#ring-grad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Corner brackets — top-left -->
  <path d="M34 48 L34 34 L48 34" stroke="#b7ff3c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <!-- top-right -->
  <path d="M80 34 L94 34 L94 48" stroke="#b7ff3c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <!-- bottom-left -->
  <path d="M34 80 L34 94 L48 94" stroke="#b7ff3c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <!-- bottom-right -->
  <path d="M80 94 L94 94 L94 80" stroke="#b7ff3c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Center ring -->
  <circle cx="64" cy="64" r="14" stroke="url(#ring-grad)" stroke-width="2.5" fill="none" filter="url(#glow)"/>

  <!-- Center dot -->
  <circle cx="64" cy="64" r="5.5" fill="url(#dot-grad)" filter="url(#glow)"/>
</svg>
